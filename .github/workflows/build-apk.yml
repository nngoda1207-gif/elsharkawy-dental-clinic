name: Build Elsharkawy Dental Clinic APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set portrait orientation
        run: |
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml || true
          grep -q 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml || sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +x
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          test -s android/release-keystore.jks
      - name: Diagnose release signing credentials safely
        if: steps.signing.outputs.available == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          STORE="android/release-keystore.jks"
          if ! keytool -list -keystore "$STORE" -storepass:env KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "STORE_PASSWORD_OK=false"
            echo "::error::Keystore could not be opened. KEYSTORE_PASSWORD does not match the decoded keystore, or KEYSTORE_BASE64 is not the expected file."
            exit 1
          fi
          echo "STORE_PASSWORD_OK=true"
          if ! keytool -list -keystore "$STORE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "ALIAS_OK=false"
            echo "::error::KEY_ALIAS was not found in the keystore."
            exit 1
          fi
          echo "ALIAS_OK=true"
          if ! keytool -certreq -keystore "$STORE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD -dname "CN=Signing Diagnostic" -file "$RUNNER_TEMP/signing-diagnostic.csr" >/dev/null 2>&1; then
            echo "KEY_PASSWORD_OK=false"
            echo "::error::Keystore and alias are valid, but KEY_PASSWORD could not unlock the private key."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing-diagnostic.csr"
          echo "KEY_PASSWORD_OK=true"
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Verify release package and signing certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.elsharkawy.dental'"
          ACTUAL="$( "$TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(/:/,"",$2); print tolower($2); exit}' )"
          EXPECTED="20bccf164ff7ff85dbb5633279d20a51a7808b0d159f998b8181cb4f18700648"
          test "$ACTUAL" = "$EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: elsharkawy-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: elsharkawy-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
